name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/678040958972/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: service-account-liberated@project-182f8434-cdcf-4c64-8aa.iam.gserviceaccount.com

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        env:
          SPRING_PROFILES_ACTIVE: prod
          GOOGLE_CLIENT_ID: 678040958972-igkfrkq71eak8qf4t2aafgsr8op020qu.apps.googleusercontent.com
          LIBERATED_JWT_SECRET: ${{ secrets.LIBERATED_JWT_SECRET }}
        with:
          service: liberated-backend
          region: us-central1
          source: ./backend
          # flags: '--build-service-account=projects/678040958972/serviceAccounts/service-account-liberated@project-182f8434-cdcf-4c64-8aa.iam.gserviceaccount.com'
          allow_unauthenticated: true
